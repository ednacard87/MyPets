<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Veterinarios y Reservas | MY PETS</title>
  <link rel="stylesheet" href="../css/styles.css?v=6" />
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main class="vet-page-section">
    <section class="page-banner vet-hero-banner">
      <div class="container">
        <h1>Veterinarios y Reservas</h1>
        <p>Veterinarios y Agendamiento de Citas — Conoce a nuestro equipo médico veterinario y agenda la consulta de tu mascota en segundos.</p>
      </div>
    </section>

    <div class="container vet-showcase-wrap">
      <!-- Círculos decorativos color durazno pastel del fondo (como en el diseño) -->
      <div class="vet-blob vet-blob-top-right" aria-hidden="true"></div>
      <div class="vet-blob vet-blob-bottom-left" aria-hidden="true"></div>

      <section class="vet-layout">
        <!-- Columna Izquierda: Disponibilidad + Formulario para Agendar Cita -->
        <div class="vet-left-column">
          <!-- Cuadro de Disponibilidad del diseño -->
          <div class="vet-cyan-box availability-card">
            <h3 class="availability-title">Disponibilidad</h3>
            <div class="availability-list">
              <label class="availability-item">
                <span>Mañana</span>
                <input type="checkbox" name="turno-filtro" value="Mañana" class="availability-checkbox" />
              </label>
              <label class="availability-item">
                <span>Tarde</span>
                <input type="checkbox" name="turno-filtro" value="Tarde" class="availability-checkbox" />
              </label>
              <label class="availability-item">
                <span>Noche</span>
                <input type="checkbox" name="turno-filtro" value="Noche" class="availability-checkbox" />
              </label>
            </div>
          </div>

          <!-- Formulario para Agendar Cita (conservado íntegro con el nuevo diseño celeste) -->
          <aside class="booking-card vet-cyan-box">
            <h2 class="booking-card-title">
              📅 Agendar Cita Veterinaria
            </h2>
            <p class="booking-card-subtitle">
              Completa los datos y tu cita quedará guardada en la sección <strong>Reservas</strong>.
            </p>

            <form id="booking-form">
              <div class="form-group">
                <label for="cita-propietario">Nombre del propietario</label>
                <input type="text" id="cita-propietario" class="form-control vet-pill-input" placeholder="Tu nombre completo" required />
              </div>

              <div style="display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 12px;">
                <div class="form-group">
                  <label for="cita-mascota">Nombre de la mascota</label>
                  <input type="text" id="cita-mascota" class="form-control vet-pill-input" placeholder="Ej: Luna" required />
                </div>

                <div class="form-group">
                  <label for="cita-especie">Especie</label>
                  <select id="cita-especie" class="form-control vet-pill-input" required>
                    <option value="Perro">Perro 🐶</option>
                    <option value="Gato">Gato 🐱</option>
                    <option value="Otro">Otro 🐾</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label for="cita-veterinario">Veterinario asignado</label>
                <select id="cita-veterinario" class="form-control vet-pill-input" required></select>
              </div>

              <div class="form-group">
                <label for="cita-servicio">Tipo de consulta / servicio</label>
                <select id="cita-servicio" class="form-control vet-pill-input" required>
                  <option value="Consulta General y Control">Consulta General y Control</option>
                  <option value="Esquema de Vacunación">Esquema de Vacunación</option>
                  <option value="Desparasitación y Profilaxis">Desparasitación y Profilaxis</option>
                  <option value="Consulta Dermatológica">Consulta Dermatológica</option>
                  <option value="Ecografía / Exámenes">Ecografía / Exámenes</option>
                </select>
              </div>

              <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                <div class="form-group">
                  <label for="cita-fecha">Fecha</label>
                  <input type="date" id="cita-fecha" class="form-control vet-pill-input" required />
                </div>

                <div class="form-group">
                  <label for="cita-hora">Hora</label>
                  <select id="cita-hora" class="form-control vet-pill-input" required>
                    <option value="08:30">08:30 AM</option>
                    <option value="10:00">10:00 AM</option>
                    <option value="11:30">11:30 AM</option>
                    <option value="14:00">02:00 PM</option>
                    <option value="15:30">03:30 PM</option>
                    <option value="16:30">04:30 PM</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label for="cita-notas">Motivo o síntomas (opcional)</label>
                <textarea id="cita-notas" class="form-control vet-pill-textarea" rows="2" placeholder="Describe brevemente el motivo de la consulta..."></textarea>
              </div>

              <button type="submit" class="btn-vet-peach btn-block">
                Confirmar Reserva
              </button>
            </form>
          </aside>
        </div>

        <!-- Columna Derecha: Listado de Veterinarios -->
        <div class="vet-right-column">
          <h2 class="section-heading">Nuestros Especialistas</h2>
          <div class="vets-list" id="vets-list-container">
            <!-- Tarjetas de veterinarios generadas por js/main.js -->
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="../js/main.js?v=6"></script>
</body>
</html>
