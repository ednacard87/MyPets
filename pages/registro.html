<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crear Cuenta | MY PETS</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main class="container">
    <section class="auth-wrapper">
      <div class="auth-header">
        <h1>Registro de Usuario</h1>
        <p style="color: var(--color-text-muted); font-size: 0.94rem;">
          Únete a la comunidad My Pets y consiente a tu mejor amigo.
        </p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label for="reg-nombre">Nombre completo</label>
          <input
            type="text"
            id="reg-nombre"
            class="form-control"
            placeholder="Ej: Miguel Ángel Pérez"
            required
          />
        </div>

        <div class="form-group">
          <label for="reg-email">Correo electrónico</label>
          <input
            type="email"
            id="reg-email"
            class="form-control"
            placeholder="miguel@correo.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="reg-telefono">Teléfono / WhatsApp</label>
          <input
            type="tel"
            id="reg-telefono"
            class="form-control"
            placeholder="300 123 4567"
            required
          />
        </div>

        <div class="form-group">
          <label for="reg-mascota">Nombre y especie de tu mascota</label>
          <input
            type="text"
            id="reg-mascota"
            class="form-control"
            placeholder="Ej: Dante (Perro Husky)"
            required
          />
        </div>

        <div class="form-group">
          <label for="reg-password">Contraseña</label>
          <input
            type="password"
            id="reg-password"
            class="form-control"
            placeholder="Crea una contraseña segura"
            minlength="3"
            required
          />
        </div>

        <button type="submit" class="btn-primary btn-block" style="margin-top: 10px;">
          Crear Cuenta
        </button>
      </form>

      <p style="text-align: center; margin-top: 18px; font-size: 0.92rem;">
        ¿Ya tienes una cuenta?
        <a href="login.html" style="color: var(--color-nav-teal); font-weight: 700; text-decoration: underline;">
          Inicia sesión aquí
        </a>
      </p>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="../js/main.js"></script>
</body>
</html>
