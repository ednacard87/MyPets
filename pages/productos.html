<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda de Productos | MY PETS</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main>
    <section class="page-banner">
      <div class="container">
        <h1>Tienda de Productos y Alimentos</h1>
        <p>Encuentra cuido premium, camas, juguetes interactivos y accesorios para perros y gatos.</p>
      </div>
    </section>

    <section class="container" style="margin-bottom: 52px;">
      <!-- Barra de filtros básicos por categoría y buscador -->
      <div class="filters-bar">
        <div class="filter-pills" role="group" aria-label="Filtrar por categoría">
          <button type="button" class="filter-btn active" data-filter-cat="todos">Todos</button>
          <button type="button" class="filter-btn" data-filter-cat="alimentos">Alimentos</button>
          <button type="button" class="filter-btn" data-filter-cat="accesorios">Accesorios y Camas</button>
          <button type="button" class="filter-btn" data-filter-cat="juguetes">Juguetes</button>
          <button type="button" class="filter-btn" data-filter-cat="higiene">Higiene</button>
        </div>

        <div class="search-box">
          <input
            type="search"
            id="search-products"
            class="form-control"
            placeholder="🔍 Buscar producto o mascota..."
            aria-label="Buscar productos"
          />
        </div>
      </div>

      <!-- Catálogo renderizado dinámicamente desde js/main.js -->
      <div class="products-grid" id="catalog-products-grid"></div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="../js/main.js"></script>
</body>
</html>
