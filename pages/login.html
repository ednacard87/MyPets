<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión | MY PETS</title>
  <link rel="stylesheet" href="../css/styles.css?v=2" />
</head>
<body>

  <header class="site-header" id="site-header"></header>

  <main class="login-page-section">
    <div class="container login-showcase">
      <!-- Círculos decorativos color durazno pastel del fondo -->
      <div class="login-blob blob-top-left" aria-hidden="true"></div>
      <div class="login-blob blob-bottom-left" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="38" height="38" fill="none" stroke="#1f2d3d">
          <path d="M22 36 C15 36 12 43 16 49 C20 55 28 53 32 49 C36 45 38 39 33 35 C29 32 26 36 22 36 Z" stroke-width="3"/>
          <ellipse cx="18" cy="24" rx="4" ry="5.5" transform="rotate(-20 18 24)" stroke-width="3"/>
          <ellipse cx="29" cy="18" rx="4" ry="5.5" transform="rotate(-5 29 18)" stroke-width="3"/>
          <ellipse cx="41" cy="21" rx="4" ry="5.5" transform="rotate(15 41 21)" stroke-width="3"/>
          <ellipse cx="48" cy="32" rx="4" ry="5" transform="rotate(32 48 32)" stroke-width="3"/>
        </svg>
      </div>
      <div class="login-blob blob-bottom-center" aria-hidden="true"></div>

      <!-- Contenedor central con el cuadro celeste y la imagen superpuesta -->
      <div class="login-stage">
        <!-- Cuadro celeste de Iniciar Sesión -->
        <section class="login-cyan-card">
          <div class="login-cyan-header">
            <h1>INICIAR SESION</h1>
            <p>Accede a tu cuenta y a los detalles de tu amigo peludo</p>
          </div>

          <form id="login-form">
            <div class="login-field">
              <label for="login-email">Correo Electronico</label>
              <input
                type="email"
                id="login-email"
                class="login-pill-input"
                placeholder="ejemplo@correo.com"
                value="demo@mypets.com"
                required
              />
            </div>

            <div class="login-field">
              <label for="login-password">Contraseña</label>
              <div class="password-input-wrap">
                <input
                  type="password"
                  id="login-password"
                  class="login-pill-input"
                  placeholder="••••••••"
                  value="123"
                  required
                />
                <button
                  type="button"
                  class="btn-toggle-pass"
                  id="btn-toggle-pass"
                  aria-label="Mostrar u ocultar contraseña"
                  title="Mostrar / ocultar contraseña"
                >
                  <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                    <line x1="1" y1="1" x2="23" y2="23"/>
                  </svg>
                </button>
              </div>
            </div>

            <button type="submit" class="btn-login-peach">
              INICIAR SESION
            </button>
          </form>

          <!-- Cuadro de cuenta de prueba lista (conservado) -->
          <div class="login-demo-box">
            <strong>💡 Cuenta de prueba lista:</strong><br />
            Correo: <code>demo@mypets.com</code> | Contraseña: <code>123</code>
          </div>

          <!-- Mensaje ¿Aún no tienes cuenta? Regístrate aquí (conservado) -->
          <p class="login-register-prompt">
            ¿Aún no tienes cuenta?
            <a href="registro.html">Regístrate aquí</a>
          </p>
        </section>

        <!-- Imagen derecha de la chica con el perro y el gato -->
        <div class="login-photo-card">
          <img src="../img/login-mascotas.jpg" alt="Dueña feliz con su gato y su perro" />
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="../js/main.js?v=2"></script>
</body>
</html>
